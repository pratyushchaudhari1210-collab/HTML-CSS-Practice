<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Form</h3>
    <form action="/action">
        <div>
            <input type="text" name="fname" placeholder=" FirstName" name="Fname">
            <input type="text" name="lname" placeholder=" LastName" name="Lname">

        </div>
        <div>
            <label for="gender">Please select your gender</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            Do you agree to the terms and conditions?
            <input type="checkbox" id="terms" name="terms" value="agree">
            <label for="terms">I agree</label>
        </div>
        <button>Register</button>
    </form>
</body>
</html>
